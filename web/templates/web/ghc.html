{% load static %}
<!DOCTYPE html>
<html>
  <head>
		<title>{{ title|default:"Guy Hopkins Construction" }}</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="Commercial, Municapal, Heavy Construction, Industrial Contractor since 1984">
    <meta name="keywords" content="Construction, Building, Structure, Engineering, Architectural, Industrial, Commercial">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
		<link href="{% static 'css/font-awesome.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'css/main.css' %} " rel="stylesheet" type="text/css">
	</head>
  <body class="{{ pageclass }}">
    <div class="header">
      <div class="binder">
        <div class="container nopad">
          <div class="flex-fifths">
            <ul class="weblinks left fifth">
              <li>
                <a href="https://www.linkedin.com/in/guy-hopkins-construction-244295146/" target="_blank"><i class="fa fa-linkedin"></i></a>
              </li>
              <li>
                <a href="https://www.facebook.com/Guy-Hopkins-Construction-164688983559334/" target="_blank"><i class="fa fa-facebook"></i></a>
              </li>
            </ul>
            <ul class="weblinks right four-fifths">
              <li>
                <a class="email" href="mailto:estimating@guyhopkins.com"><i class="fa fa-envelope-o"></i> estimating@guyhopkins.com</a>
              </li>
              <li>
                <a class="phone" href="tel:1-225-751-2158"><i class="fa fa-phone"></i> 225-751-2158</a>
              </li>
              <li>
                <a class="fax" href="tel:1-225-751-2159"><i class="fa fa-print"></i> 225-751-2159</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
      
      <div class="brand">
        <div class="container flex-fifths">
          <div class="two-fifths">
            <div class="logo">
              <a href="http://guyhopkins.com">
                <img src="{% static 'img/Guy-Hopkins-Title-Logo.png' %}" alt="Guy Hopkins Construction">
              </a>
            </div>
            <div class="nav-click" id="nav-click">
              <i class="fa fa-bars"></i>
            </div>
          </div>
          <div class="three-fifths">
            <div class="nav" data-state="hide" id="nav">
              <ul class="navlinks">
                <li>
                  <a href="/">Home</a>
                </li>
                <li>
                  <a href="/about-us">About Us</a>
                </li>
                <li>
                  <a href="/services">Services</a>
                </li>
                <li>
                  <a href="/projects">Projects</a>
                </li>
                <li>
                  <a href="/contact-us">Contact Us</a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="content">
      {% block content %}
      {% endblock %}
    </div>
    <div class="footer">
      <div class="container">
        <p>Guy Hopkins Construction Co. &copy; 2026</p>
      </div>
    </div>
    
 
    <script src="{% static 'js/main.js' %}" type="text/javascript"></script>
  </body>
</html>
